name: Browser smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.64.0
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke-results
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
